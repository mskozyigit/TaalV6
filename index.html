<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pagina Laadpagina</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }
        #loading-screen {
            font-size: 6em; /* 3 kat daha büyük */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .loading-bar-container {
            width: 90%; /* Daha geniş yükleme çubuğu */
            background-color: #ddd;
            border-radius: 5px;
            height: 30px; /* Daha kalın yükleme çubuğu */
            margin-top: 40px; /* Daha fazla boşluk */
            overflow: hidden;
        }
        .loading-bar {
            width: 0%;
            height: 100%;
            background-color: #007bff;
            border-radius: 5px;
            animation: fillBar 2s forwards;
        }
        @keyframes fillBar {
            from { width: 0%; }
            to { width: 100%; }
        }
        #level-selection {
            display: none; /* Hidden by default */
            text-align: center;
        }
        .level-button {
            display: block;
            margin: 20px auto; /* Daha fazla boşluk */
            padding: 30px 60px; /* 2 kat daha büyük padding */
            width: 500px; /* 2 kat daha büyük genişlik */
            height: 140px; /* 2 kat daha büyük yükseklik */
            font-size: 3em; /* 2 kat daha büyük font */
            font-weight: bold; /* Kalın yazı */
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 15px; /* Daha yuvarlak köşeler */
            text-decoration: none;
            box-shadow: 0 8px 0 #0056b3; /* Daha belirgin 3D efekti */
            transition: all 0.1s ease;
        }
        .level-button:hover {
            background-color: #0056b3;
            transform: translateY(4px); /* Daha belirgin hareket */
            box-shadow: 0 4px 0 #004085;
        }
        .level-button:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #004085;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        Laden...
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>
    <div id="level-selection">
        <h1>Kies een niveau</h1>
        <button class="level-button" onclick="location.href='level1.html'">Beginner (A1/A2)</button>
        <button class="level-button" onclick="location.href='level2.html'">Gemiddeld (B1/B2)</button>
        <button class="level-button" onclick="location.href='level3.html'">Gevorderd (B2 en hoger)</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                document.getElementById("loading-screen").style.display = "none";
                document.getElementById("level-selection").style.display = "block";
            }, 2000); // 2 saniye sonra seviye seçimini göster (yükleme çubuğu animasyonu için)
        });
    </script>
</body>
</html>
