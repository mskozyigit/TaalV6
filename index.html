<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pagina Laadpagina</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }
        #loading-screen {
            font-size: 2em;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .loading-bar-container {
            width: 80%;
            background-color: #ddd;
            border-radius: 5px;
            height: 20px;
            margin-top: 20px;
            overflow: hidden;
        }
        .loading-bar {
            width: 0%;
            height: 100%;
            background-color: #007bff;
            border-radius: 5px;
            animation: fillBar 2s forwards;
        }
        @keyframes fillBar {
            from { width: 0%; }
            to { width: 100%; }
        }
        #level-selection {
            display: none; /* Hidden by default */
            text-align: center;
        }
        .level-button {
            display: block;
            margin: 15px auto;
            padding: 15px 30px;
            width: 250px; /* Standart genişlik */
            height: 70px; /* Standart yükseklik */
            font-size: 1.5em;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 5px 0 #0056b3; /* 3D efekti için gölge */
            transition: all 0.1s ease;
        }
        .level-button:hover {
            background-color: #0056b3;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #004085;
        }
        .level-button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #004085;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        Laden...
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>
    <div id="level-selection">
        <h1>Kies een niveau</h1>
        <button class="level-button" onclick="location.href='level1.html'">Beginner (A1/A2)</button>
        <button class="level-button" onclick="location.href='level2.html'">Gemiddeld (B1/B2)</button>
        <button class="level-button" onclick="location.href='level3.html'">Gevorderd (B2 en hoger)</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                document.getElementById("loading-screen").style.display = "none";
                document.getElementById("level-selection").style.display = "block";
            }, 2000); // 2 saniye sonra seviye seçimini göster (yükleme çubuğu animasyonu için)
        });
    </script>
</body>
</html>
