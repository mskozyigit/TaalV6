<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gevorderd Niveau (B2 en hoger)</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 800px; /* İçeriği ortalamak için */
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .nav-buttons {
            display: flex;
            align-items: center;
        }
        .home-button {
            font-size: 2.5em; /* Daha büyük ev ikonu */
            text-decoration: none;
            color: #dc3545; /* Duolingo kırmızısı */
            margin-right: 15px;
            line-height: 1;
        }
        .back-button {
            padding: 10px 15px;
            font-size: 1em;
            cursor: pointer;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            box-shadow: 0 3px 0 #545b62;
            transition: all 0.1s ease;
        }
        .back-button:hover {
            background-color: #5a6268;
            transform: translateY(1px);
            box-shadow: 0 2px 0 #494f54;
        }
        .back-button:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #494f54;
        }
        h1 {
            color: #dc3545; /* Başlık rengi */
        }
        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Standart buton genişliği */
            gap: 20px;
            width: 100%;
            max-width: 800px; /* İçeriği ortalamak için */
            justify-content: center; /* Butonları ortalamak için */
        }
        .action-button {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 30px;
            width: 250px; /* Standart genişlik */
            height: 70px; /* Standart yükseklik */
            font-size: 1.5em;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 5px 0 #c82333; /* 3D efekti için gölge */
            transition: all 0.1s ease;
            margin: auto; /* Butonları kendi içinde ortalamak için */
        }
        .action-button:hover {
            background-color: #c82333;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #bd2130;
        }
        .action-button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #bd2130;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav-buttons">
            <a href="index.html" class="home-button">🏠</a>
            <button onclick="history.back()" class="back-button">Terug</button>
        </div>
        <h1>Gevorderd Niveau (B2 en hoger)</h1>
    </div>

    <div class="button-container">
        <button class="action-button">Actie 1</button>
        <button class="action-button">Actie 2</button>
        <button class="action-button">Actie 3</button>
        <button class="action-button">Actie 4</button>
        <button class="action-button">Actie 5</button>
        <button class="action-button">Actie 6</button>
    </div>
</body>
</html>
